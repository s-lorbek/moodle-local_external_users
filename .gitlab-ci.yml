moodle_plugin_ci:
  stage: test

  image: $MOODLE_PHP_IMAGE

  parallel:
    matrix:
      - MOODLE_BRANCH: ["MOODLE_501_STABLE"]
        MOODLE_PHP_IMAGE: ["moodlehq/moodle-php-apache:8.3"]
        POSTGRES_IMAGE: ["postgres:18-alpine"]
        MOODLE_DIR: "/var/www/html"
        MOODLE_DIR_PUBLIC: "/var/www/html/public"
      - MOODLE_BRANCH: ["MOODLE_405_STABLE"]
        MOODLE_PHP_IMAGE: ["moodlehq/moodle-php-apache:8.3"]
        POSTGRES_IMAGE: ["postgres:16-alpine"]
        MOODLE_DIR: "/var/www/html"
        MOODLE_DIR_PUBLIC: "/var/www/html"


  services:
    - name: selenium/standalone-chrome:4
      alias: selenium
    - name: $POSTGRES_IMAGE
      alias: db

  variables:
    DB: "pgsql"
    POSTGRES_HOST_AUTH_METHOD: trust
    MOODLE_BEHAT_WDHOST: "http://selenium:4444/wd/hub"
    MOODLE_START_BEHAT_SERVERS: "NO"
    NODE_VERSION: "v22.23.1"
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
    MOODLE_REPO: "https://gitlab-ci-token:${MOODLE_READ_ONLY}@gitlab.uni-graz.at/715-scrum1/grp_moodle/moodle.git"
    NVM_VERSION: "v0.40.5"

  cache:
    paths:
      - .cache

  before_script:
    # Update packages and install mysql-client.
    - apt update && apt install -y postgresql-client postgresql-client-common default-jre-headless
    # Install nvm and NodeJS.
    - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/$NVM_VERSION/install.sh | bash
    - . $HOME/.nvm/nvm.sh
    - nvm install $NODE_VERSION
    # Install composer.
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
    # Configure Behat, the webserver will run directly on the job-container on port 8000.
    - export IPADDRESS=`grep "$HOSTNAME$" /etc/hosts | awk '{print $1}'`
    - export MOODLE_BEHAT_WWWROOT="http://$IPADDRESS:8000"
    # Install Moodle CI plugin.
    - composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci /opt/mci ^4
    - export PATH="$(cd /opt/mci/bin; pwd):$(cd /opt/mci/vendor/bin; pwd):$PATH"
    - chmod u+x /opt/mci/bin/moodle-plugin-ci
    - chmod u+x /opt/mci/bin/*
    - umask u+x
    # Install Moodle.
    - cd $CI_PROJECT_DIR
    - moodle-plugin-ci install --moodle=$MOODLE_DIR --db-type=pgsql --db-host=db
    - moodle-plugin-ci add-config '$CFG->behat_profiles["chrome"]["capabilities"]["extra_capabilities"]["goog:chromeOptions"]["args"] = ["--headless", "--disable-gpu", "--no-sandbox", "--disable-dev-shm-usage"];'
    # Start webserver for behat tests.
    - export PHP_CLI_SERVER_WORKERS=5
    - php -S 0.0.0.0:8000 -t $MOODLE_DIR_PUBLIC > /dev/null 2>&1 &

  script:
    # Documentation for each step: https://moodlehq.github.io/moodle-plugin-ci/Help.html
    - moodle-plugin-ci phplint
    - moodle-plugin-ci phpunit --fail-on-warning
    - moodle-plugin-ci phpcpd
    - moodle-plugin-ci phpmd
    - moodle-plugin-ci phpcs --max-warnings 0
    - moodle-plugin-ci phpdoc --max-warnings 0
    - moodle-plugin-ci validate
    - moodle-plugin-ci savepoints
    - moodle-plugin-ci mustache
    - moodle-plugin-ci grunt --max-lint-warnings 0
    - moodle-plugin-ci behat --profile chrome

  artifacts:
    when: on_failure
    paths:
      - $CI_PROJECT_DIR/moodledata/behat_dump/*
    expire_in: 1 week
